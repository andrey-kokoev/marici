<ellipse cx="200" cy="170" rx="155" ry="60" transform="rotate(60 200 170)"/>
<ellipse cx="200" cy="170" rx="155" ry="60" transform="rotate(-60 200 170)"/>
<ellipse cx="200" cy="195" rx="145" ry="45"/>
<path d="M200 85 125 225 275 225Z M200 85 200 170 125 225 M200 170 275 225" fill="none" stroke="#ffe1a0" stroke-width="3"/>
</g>
<text x="330" y="390" text-anchor="middle" fill="#edf3fa" font-family="system-ui,sans-serif" font-size="24">Four intersecting disks</text>
<text x="330" y="422" text-anchor="middle" fill="#b9c9de" font-family="system-ui,sans-serif" font-size="17">Planes · repeats · intersections · free camera roll</text>
