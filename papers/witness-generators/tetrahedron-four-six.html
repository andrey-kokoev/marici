<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four proton pieces and six belt pieces</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101827; color: #e5edf8; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    header { position: absolute; top: 24px; left: 24px; pointer-events: none; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 550; }
    p { margin: 0; color: #a8b8cc; font-size: 14px; }
    footer { position: absolute; bottom: 24px; left: 24px; right: 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    button { background: #24364c; color: #e5edf8; border: 1px solid #58718d; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #80dcff; outline-offset: 3px; }
    #error { position: absolute; top: 110px; left: 24px; right: 24px; color: #ffb4a8; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header><h1>Four + six + four face-to-center tetrahedra</h1><p>Original geometry · four pieces per outer tetrahedron · six belt pieces · no gap-filling caps added</p></header>
  <footer>
    <label><input id="vertices" type="checkbox" checked> 4 vertices</label>
    <label><input id="edges" type="checkbox" checked> 6 edges</label>
    <label><input id="faces" type="checkbox" checked> 3 faces</label>
    <label><input id="closure" type="checkbox" checked> Filler + bottom face</label>
    <label><input id="belt" type="checkbox" checked> Connecting belt</label>
    <label><input id="center-cones" type="checkbox" checked> Face-to-center tetrahedra</label>
    <label><input id="separate" type="checkbox"> Separate</label>
    <label><input id="explode" type="checkbox"> Explode</label>
    <label>Factor <input id="explosion-factor" type="range" min="1" max="4" step="0.05" value="2"> <output id="factor-value" for="explosion-factor">2.00×</output></label>
    <button id="reset" type="button">Reset view</button>
    <p>Explode to see all 14 pieces · Yellow points are derived centers · Volumes are not assigned masses</p>
  </footer>
  <p id="error" role="alert" hidden></p>
  <script type="module">
    const error = document.querySelector('#error');
    try {
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#101827');
      const viewHeight = 7;
      const aspect = innerWidth / innerHeight;
      const camera = new THREE.OrthographicCamera(
        -viewHeight * aspect / 2, viewHeight * aspect / 2,
        viewHeight / 2, -viewHeight / 2, 0.1, 100
      );
      camera.position.set(3.8, 2.6, 5.0);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.domElement.setAttribute('aria-label', 'Two complete tetrahedral figures with opposing triangular bottom faces');
      document.body.prepend(renderer.domElement);

      // A regular tetrahedron centered at its centroid. The base has radius 1;
      // every edge has length sqrt(3). There is no extra hub or central vertex.
      const h = Math.sqrt(2);
      const r = Math.sqrt(3) / 2;
      const positions = [
        new THREE.Vector3(0, 3 * h / 4, 0),
        new THREE.Vector3(0, -h / 4, 1),
        new THREE.Vector3(-r, -h / 4, -0.5),
        new THREE.Vector3(r, -h / 4, -0.5)
      ];
      const tetrahedron = new THREE.Group();
      tetrahedron.name = 'tetrahedron';
      const assembly = new THREE.Group();
      assembly.name = 'facing-tetrahedra';
      scene.add(assembly);
      assembly.add(tetrahedron);
      const parts = {};
      for (const name of ['vertices', 'edges', 'faces', 'closure']) {
        parts[name] = new THREE.Group();
        parts[name].name = name;
        tetrahedron.add(parts[name]);
      }
      const vertexGeometry = new THREE.SphereGeometry(0.025, 16, 12);
      const vertexMaterial = new THREE.MeshBasicMaterial({ color: '#ffffff' });
      positions.forEach((position, i) => {
        const vertex = new THREE.Mesh(vertexGeometry, vertexMaterial);
        vertex.name = ['A', 'B', 'C', 'D'][i];
        vertex.position.copy(position);
        parts.vertices.add(vertex);
      });
      const edgeMaterial = new THREE.LineBasicMaterial({ color: '#d4f5ff' });
      for (const [a, b] of [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 1]]) {
        const edge = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([positions[a], positions[b]]), edgeMaterial
        );
        edge.name = 'ABCD'[a] + 'ABCD'[b];
        parts.edges.add(edge);
      }
      const material = new THREE.MeshStandardMaterial({
        color: '#56b8da', roughness: 0.65, metalness: 0.05, flatShading: true,
        transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false
      });
      const makeFace = (indices, name) => {
        const geometry = new THREE.BufferGeometry().setFromPoints(indices.map(i => positions[i]));
        geometry.computeVertexNormals();
        const face = new THREE.Mesh(geometry, material);
        face.name = name;
        return face;
      };
      parts.faces.add(makeFace([0, 2, 1], 'ABC'), makeFace([0, 3, 2], 'ACD'), makeFace([0, 1, 3], 'ADB'));
      // The closure is a complete tetrahedral solid, visualized by its boundary.
      // At rest its three side faces coincide with the separate side faces.
      // Draw only its bottom at rest to avoid double-blending coincident surfaces;
      // explosion exposes its full boundary as one independently moving object.
      const fillerSides = new THREE.Group();
      fillerSides.name = 'filler-side-boundary';
      fillerSides.add(makeFace([0, 2, 1], 'filler-ABC'), makeFace([0, 3, 2], 'filler-ACD'), makeFace([0, 1, 3], 'filler-ADB'));
      parts.closure.add(fillerSides, makeFace([1, 2, 3], 'filler-BCD'));

      const opposite = tetrahedron.clone(true);
      opposite.name = 'opposite-tetrahedron';
      const gap = 0.7;
      tetrahedron.position.y = h / 4 + gap / 2;
      opposite.rotation.x = Math.PI;
      opposite.position.y = -h / 4 - gap / 2;
      assembly.add(opposite);
      const figures = [tetrahedron, opposite].map(root => ({
        root,
        rest: root.position.clone(),
        parts: Object.fromEntries(['vertices', 'edges', 'faces', 'closure'].map(name => [name, root.getObjectByName(name)])),
        fillerSides: root.getObjectByName('filler-side-boundary')
      }));

      // The opposing base triangles are in antiprism alignment. Connect each
      // vertex to the two nearest vertices on the opposite triangle: six stitches.
      const belt = new THREE.Group();
      belt.name = 'connecting-belt';
      assembly.add(belt);
      const basePoints = figures.map(({ root }) => positions.slice(1).map(point =>
        point.clone().applyQuaternion(root.quaternion).add(root.position)
      ));
      // Own the two triangular rims rather than borrowing the tetrahedra's
      // vertices and edges: the belt remains complete when separated.
      for (let side = 0; side < 2; side++) {
        for (let i = 0; i < 3; i++) {
          const vertex = new THREE.Mesh(vertexGeometry, vertexMaterial);
          vertex.name = `belt-vertex-${side}-${i}`;
          vertex.position.copy(basePoints[side][i]);
          vertex.userData.componentCenter = basePoints[side][i].clone();
          belt.add(vertex);
          const edge = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
              basePoints[side][i], basePoints[side][(i + 1) % 3]
            ]), edgeMaterial
          );
          edge.name = `belt-rim-${side}-${i}`;
          belt.add(edge);
        }
      }
      const stitches = [];
      for (let a = 0; a < 3; a++) {
        const nearest = [0, 1, 2].sort((b, c) =>
          basePoints[0][a].distanceToSquared(basePoints[1][b]) -
          basePoints[0][a].distanceToSquared(basePoints[1][c])
        ).slice(0, 2);
        for (const b of nearest) {
          stitches.push([a, b]);
          const edge = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([basePoints[0][a], basePoints[1][b]]), edgeMaterial
          );
          edge.name = `stitch-${a}-${b}`;
          belt.add(edge);
        }
      }
      const beltTriangles = [];
      const beltFace = (points, name) => {
        beltTriangles.push(points.map(point => point.clone()));
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        geometry.computeVertexNormals();
        const face = new THREE.Mesh(geometry, material);
        face.name = name;
        belt.add(face);
      };
      for (let a = 0; a < 3; a++) {
        const neighbors = stitches.filter(([i]) => i === a).map(([, b]) => basePoints[1][b]);
        beltFace([basePoints[0][a], ...neighbors], `belt-upper-${a}`);
      }
      for (let b = 0; b < 3; b++) {
        const neighbors = stitches.filter(([, j]) => j === b).map(([a]) => basePoints[0][a]);
        beltFace([basePoints[1][b], ...neighbors], `belt-lower-${b}`);
      }

      scene.add(new THREE.HemisphereLight('#cceaff', '#253044', 2));
      const light = new THREE.DirectionalLight('#ffffff', 3);
      light.position.set(3, 5, 4);
      scene.add(light);
      // OrbitControls drives an invisible control camera. Transfer its rotation
      // to the figure instead: the visible camera and lights stay fixed in space.
      const controlCamera = camera.clone();
      const controls = new OrbitControls(controlCamera, renderer.domElement);
      controls.enablePan = false;
      controls.minZoom = 0.3;
      controls.maxZoom = 3;
      controls.update();
      const initialRotation = controlCamera.quaternion.clone();
      controls.saveState();
      let explosionAmount = 0;
      let separationAmount = 0;
      const render = () => {
        const conesEnabled = centerConesToggle.checked;
        for (const figure of figures) {
          figure.root.position.copy(figure.rest).multiplyScalar(1 + 0.5 * separationAmount);
          figure.parts.faces.visible = !conesEnabled && document.getElementById('faces').checked;
          figure.parts.closure.visible = !conesEnabled && document.getElementById('closure').checked;
          figure.cones.visible = conesEnabled && document.getElementById('faces').checked;
          figure.fillerSides.visible = explosionAmount > 0 || !figure.parts.faces.visible;
        }
        beltCones.visible = conesEnabled && document.getElementById('belt').checked;
        for (const object of belt.children) {
          if (object.name.startsWith('belt-upper-') || object.name.startsWith('belt-lower-')) object.visible = !conesEnabled;
        }
        for (const entry of explosion) {
          const { object, rest, offset, root, center } = entry;
          // Recompute the radial displacement against the current separated layout.
          if (root) offset.copy(center).applyQuaternion(root.quaternion).add(root.position)
            .sub(barycenter).applyQuaternion(root.quaternion.clone().invert());
          object.position.copy(rest).addScaledVector(offset, explosionAmount);
        }
        renderer.render(scene, camera);
      };
      const updateFigure = () => {
        assembly.quaternion.copy(initialRotation)
          .multiply(controlCamera.quaternion.clone().invert());
        camera.zoom = controlCamera.zoom;
        camera.updateProjectionMatrix();
        camera.lookAt(0, 0, 0);
        render();
      };
      controls.addEventListener('change', updateFigure);
      for (const [name, part] of Object.entries(parts)) {
        document.getElementById(name).addEventListener('change', event => {
          for (const figure of figures) figure.parts[name].visible = event.target.checked;
          render();
        });
      }
      document.getElementById('belt').addEventListener('change', event => {
        belt.visible = event.target.checked;
        render();
      });
      // One radial rule for all rigid components: c' = B + factor * (c - B).
      // B is the barycenter of all eight vertices, in assembly coordinates.
      const barycenter = new THREE.Vector3();
      for (const { root } of figures) {
        for (const point of positions) barycenter.add(point.clone().applyQuaternion(root.quaternion).add(root.position));
      }
      barycenter.divideScalar(8);
      const centerConesToggle = document.getElementById('center-cones');
      const conePieces = [];
      const centerMarker = point => {
        const marker = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12),
          new THREE.MeshBasicMaterial({ color: '#ffdf70' }));
        marker.position.copy(point);
        return marker;
      };
      const makeCone = (points, color, name, parent, root = null) => {
        const group = new THREE.Group();
        group.name = name;
        const boundary = [[0, 2, 1], [0, 1, 3], [0, 3, 2], [1, 2, 3]];
        const geometry = new THREE.BufferGeometry().setFromPoints(boundary.flatMap(face => face.map(i => points[i])));
        geometry.computeVertexNormals();
        group.add(new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
          color, roughness: 0.65, transparent: true, opacity: 0.34,
          side: THREE.DoubleSide, depthWrite: false, flatShading: true
        })));
        const edges = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
        group.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edges.flatMap(edge => edge.map(i => points[i]))),
          new THREE.LineBasicMaterial({ color })));
        parent.add(group);
        const center = points.reduce((sum, point) => sum.add(point), new THREE.Vector3()).divideScalar(4);
        conePieces.push({ object: group, root, center });
      };
      const faceIndices = [[0, 2, 1], [0, 3, 2], [0, 1, 3], [1, 2, 3]];
      const protonColors = ['#54c8eb', '#64dfb6', '#8aa8ff', '#c79aef'];
      for (const figure of figures) {
        const center = positions.reduce((sum, point) => sum.add(point), new THREE.Vector3()).divideScalar(4);
        figure.cones = new THREE.Group();
        figure.cones.name = 'four-center-cones';
        figure.root.add(figure.cones);
        figure.cones.add(centerMarker(center));
        faceIndices.forEach((face, i) => makeCone([center, ...face.map(j => positions[j])], protonColors[i],
          `proton-center-piece-${i + 1}`, figure.cones, figure.root));
      }
      const beltCones = new THREE.Group();
      beltCones.name = 'six-belt-center-cones';
      assembly.add(beltCones);
      beltCones.add(centerMarker(barycenter));
      const beltColors = ['#ff9e66', '#ffc85c', '#f5ed88', '#f57e9e', '#cc8ce8', '#ffadba'];
      beltTriangles.forEach((face, i) => makeCone([barycenter, ...face], beltColors[i],
        `belt-center-piece-${i + 1}`, beltCones));
      if (conePieces.length !== 14 || beltTriangles.length !== 6) throw new Error('Unexpected face-to-center piece count');
      const explosion = [];
      for (const { root, parts } of figures) {
        const record = (object, center) => {
          const offset = center.clone().applyQuaternion(root.quaternion).add(root.position)
            .sub(barycenter).applyQuaternion(root.quaternion.clone().invert());
          explosion.push({ object, rest: object.position.clone(), offset, root, center: center.clone() });
        };
        for (const vertex of parts.vertices.children) record(vertex, vertex.position);
        for (const group of [parts.edges, parts.faces]) {
          for (const object of group.children) {
            const position = object.geometry.getAttribute('position');
            const center = new THREE.Vector3();
            for (let i = 0; i < position.count; i++) center.add(new THREE.Vector3().fromBufferAttribute(position, i));
            record(object, center.divideScalar(position.count));
          }
        }
        const fillerCenter = positions.reduce((sum, point) => sum.add(point), new THREE.Vector3()).divideScalar(4);
        record(parts.closure, fillerCenter);
      }
      // Belt components use the same combined barycenter and factor.
      for (const object of belt.children) {
        const center = object.userData.componentCenter?.clone() ?? new THREE.Vector3();
        if (!object.userData.componentCenter) {
          const position = object.geometry.getAttribute('position');
          for (let i = 0; i < position.count; i++) center.add(new THREE.Vector3().fromBufferAttribute(position, i));
          center.divideScalar(position.count);
        }
        explosion.push({ object, rest: object.position.clone(), offset: center.sub(barycenter) });
      }
      for (const { object, center, root } of conePieces) {
        const offset = center.clone();
        if (root) offset.applyQuaternion(root.quaternion).add(root.position);
        offset.sub(barycenter);
        if (root) offset.applyQuaternion(root.quaternion.clone().invert());
        explosion.push({ object, rest: object.position.clone(), offset, root, center: center.clone() });
      }
      centerConesToggle.addEventListener('change', render);
      let explosionFrame = null;
      const explodeToggle = document.getElementById('explode');
      const factorSlider = document.getElementById('explosion-factor');
      const animateExplosion = () => {
        if (explosionFrame !== null) cancelAnimationFrame(explosionFrame);
        const from = explosionAmount;
        const to = explodeToggle.checked ? Number(factorSlider.value) - 1 : 0;
        const start = performance.now();
        const duration = 650;
        const animate = now => {
          const t = Math.min((now - start) / duration, 1);
          const eased = t * t * (3 - 2 * t);
          explosionAmount = from + (to - from) * eased;
          render();
          explosionFrame = t < 1 ? requestAnimationFrame(animate) : null;
        };
        explosionFrame = requestAnimationFrame(animate);
      };
      explodeToggle.addEventListener('change', animateExplosion);
      factorSlider.addEventListener('input', () => {
        document.getElementById('factor-value').value = Number(factorSlider.value).toFixed(2) + '×';
        animateExplosion();
      });
      let separationFrame = null;
      const separateToggle = document.getElementById('separate');
      separateToggle.addEventListener('change', () => {
        if (separationFrame !== null) cancelAnimationFrame(separationFrame);
        const from = separationAmount;
        const to = separateToggle.checked ? 1 : 0;
        const start = performance.now();
        const animate = now => {
          const t = Math.min((now - start) / 650, 1);
          separationAmount = from + (to - from) * t * t * (3 - 2 * t);
          render();
          separationFrame = t < 1 ? requestAnimationFrame(animate) : null;
        };
        separationFrame = requestAnimationFrame(animate);
      });
      // Browsers can restore checkbox values independently of module state.
      // Initialize the scene from the actual controls, including history restores.
      const syncControlState = () => {
        if (explosionFrame !== null) cancelAnimationFrame(explosionFrame);
        if (separationFrame !== null) cancelAnimationFrame(separationFrame);
        explosionFrame = separationFrame = null;
        separationAmount = separateToggle.checked ? 1 : 0;
        explosionAmount = explodeToggle.checked ? Number(factorSlider.value) - 1 : 0;
        document.getElementById('factor-value').value = Number(factorSlider.value).toFixed(2) + '×';
        for (const figure of figures) {
          for (const [name, part] of Object.entries(figure.parts)) {
            part.visible = document.getElementById(name).checked;
          }
        }
        belt.visible = document.getElementById('belt').checked;
        updateFigure();
      };
      addEventListener('pageshow', syncControlState);
      syncControlState();
      document.querySelector('#reset').addEventListener('click', () => { controls.reset(); render(); });
      addEventListener('resize', () => {
        const aspect = innerWidth / innerHeight;
        for (const view of [camera, controlCamera]) {
          view.left = -viewHeight * aspect / 2;
          view.right = viewHeight * aspect / 2;
          view.top = viewHeight / 2;
          view.bottom = -viewHeight / 2;
          view.updateProjectionMatrix();
        }
        renderer.setSize(innerWidth, innerHeight);
        render();
      });
      render();
    } catch (cause) {
      error.hidden = false;
      error.textContent = 'Unable to load the scene. Internet access to jsDelivr and a WebGL-capable browser are required. ' + cause.message;
      console.error(cause);
    }
  </script>
</body>
</html>
