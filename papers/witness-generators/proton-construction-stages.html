<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proton-like figure — geometric construction</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#101827;color:#e5edf8;font:15px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}aside{position:absolute;top:16px;left:16px;width:320px;max-height:calc(100vh - 100px);overflow:auto;background:#101827ed;padding:18px;border:1px solid #40556e;border-radius:10px}h1{font-size:20px;margin:0 0 14px}p{line-height:1.5;color:#b9c9db}button,select{background:#25364d;color:#fff;border:1px solid #57718e;border-radius:5px;padding:9px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffcf6e}nav{display:grid;gap:7px}nav button{text-align:left}nav button[aria-current="step"]{border-color:#ffd777;background:#4c4029}#description{min-height:95px}#counts{font:14px ui-monospace,monospace;color:#ffdf91;white-space:pre-line;line-height:1.7}.control{display:block;margin:14px 0}footer{position:absolute;bottom:15px;left:16px;right:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#101827dd;padding:8px;border-radius:6px}footer span{color:#b9c9db;font-size:13px}#error{position:absolute;top:20px;right:20px;max-width:450px;color:#ffb7ac;background:#101827;padding:15px}#error[hidden]{display:none}@media(max-width:650px){aside{width:245px;font-size:13px;padding:12px;max-height:58vh}h1{font-size:16px}nav button{padding:6px}footer span{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<aside>
<h1>Proton-like figure in 3D</h1>
<nav aria-label="Construction stages">
<button data-step="0">1 · Four vertices</button>
<button data-step="1">2 · Twelve directed edges</button>
<button data-step="2">3 · Twelve face triangles</button>
<button data-step="3">4 · Four center-to-face tetrahedra</button>
<button data-step="4">5 · Where g = 12 and m = 3 live</button>
</nav>
<p id="description" aria-live="polite"></p><div id="counts"></div>
<label id="explode-control" class="control" hidden>Separate the four pieces<br><input id="explode" type="range" min="0" max="1.7" step="0.01" value="0"></label>
<label id="triangle-control" class="control" hidden>Highlight one of the 12 triangles<br><select id="triangle" aria-label="Selected small triangle"></select></label>
<p style="font-size:12px">Geometric assembly guide, not a time evolution. Coordinate guides are not additional primitive arrows.</p>
</aside>
<footer><button id="previous">Previous</button><button id="next">Next</button><button id="reset">Reset view</button><span>Drag to rotate · Scroll to zoom · One proton-like figure, no belt</span></footer>
<p id="error" role="alert" hidden></p>
<script type="module">
const error=document.querySelector('#error');
try {
const THREE=await import('three');
const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const scene=new THREE.Scene();scene.background=new THREE.Color('#101827');
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);camera.position.set(5.6,4.1,6.3);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.domElement.setAttribute('aria-label','Step-by-step geometric construction of one proton-like tetrahedron');document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.45,0,0);controls.enablePan=true;controls.minDistance=3;controls.maxDistance=20;controls.update();controls.saveState();
scene.add(new THREE.HemisphereLight('#e3f5ff','#24354f',2.2));const light=new THREE.DirectionalLight('#ffffff',2);light.position.set(4,6,5);scene.add(light);
const root=new THREE.Group();root.position.x=.5;scene.add(root);
const P={A:new THREE.Vector3(1,1,1),B:new THREE.Vector3(1,-1,-1),C:new THREE.Vector3(-1,1,-1),D:new THREE.Vector3(-1,-1,1)};
const O=new THREE.Vector3();const faces=[['A','B','C'],['A','D','B'],['A','C','D'],['B','D','C']];
const colors=['#51c7eb','#8cba77','#bb94ea','#efb16b'];
const group=()=>{const g=new THREE.Group();root.add(g);return g;};
const vertices=group(),edgeLines=group(),arrows=group(),surface=group(),faceCenters=group(),solids=group(),axes=group();
function label(text,point,color='#e5edf8',scale=.38){const canvas=document.createElement('canvas');canvas.width=256;canvas.height=80;const ctx=canvas.getContext('2d');ctx.font='bold 40px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(text,128,40);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(canvas),depthTest:false,transparent:true}));sprite.position.copy(point);sprite.scale.set(scale*3.2,scale,1);return sprite;}
function dot(point,parent,color='#ffffff',radius=.032){const m=new THREE.Mesh(new THREE.SphereGeometry(radius,14,10),new THREE.MeshBasicMaterial({color}));m.position.copy(point);parent.add(m);return m;}
function line(points,parent,color='#c9e5ed'){const obj=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color}));parent.add(obj);return obj;}
function triangle(points,parent,color,opacity=.28){const g=new THREE.BufferGeometry().setFromPoints(points);g.computeVertexNormals();const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,opacity,transparent:true,side:THREE.DoubleSide,depthWrite:false,roughness:.7}));parent.add(m);return m;}
for(const [name,p] of Object.entries(P)){dot(p,vertices);vertices.add(label(name,p.clone().multiplyScalar(1.13)));}
const names=Object.keys(P);
for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
 const a=P[names[i]],b=P[names[j]],v=b.clone().sub(a),length=v.length(),direction=v.clone().normalize();line([a,b],edgeLines,'#59768d');
 let offset=new THREE.Vector3().crossVectors(direction,a.clone().add(b));if(offset.lengthSq()<1e-8)offset.crossVectors(direction,new THREE.Vector3(0,1,0));offset.normalize().multiplyScalar(.035);
 for(const sign of [1,-1]){const d=direction.clone().multiplyScalar(sign),start=(sign===1?a:b).clone().addScaledVector(offset,sign).addScaledVector(d,.08);arrows.add(new THREE.ArrowHelper(d,start,length-.16,'#b1dff5',.16,.065));}
}
const patches=[],pieces=[];
faces.forEach((face,f)=>{
 const points=face.map(v=>P[v]);const F=points.reduce((a,p)=>a.add(p),new THREE.Vector3()).divideScalar(3);
 dot(F,faceCenters,'#ffd975');faceCenters.add(label('F'+face.slice().sort().join(''),F.clone().multiplyScalar(1.18),'#ffd975',.22));
 for(let i=0;i<3;i++){const a=face[i],b=face[(i+1)%3];const mesh=triangle([F,P[a],P[b]],surface,colors[f]);line([F,P[a]],surface,'#91a9bd');patches.push({face:f,a,b,F,mesh,center:F.clone().add(P[a]).add(P[b]).divideScalar(3)});}
 const piece=new THREE.Group();piece.name='center-cone-'+face.join('');solids.add(piece);const pts=[O,...points];
 for(const ids of [[0,1,2],[0,2,3],[0,3,1],[1,2,3]])triangle(ids.map(i=>pts[i]),piece,colors[f],.3);
 for(const [a,b] of [[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]])line([pts[a],pts[b]],piece,colors[f]);
 const center=points.reduce((a,p)=>a.add(p),new THREE.Vector3()).divideScalar(4);piece.add(label(face.slice().sort().join(''),center.clone().multiplyScalar(1.45),colors[f],.26));pieces.push({piece,center});
});
const centerGroup=group();dot(O,centerGroup,'#ffd975',.045);centerGroup.add(label('O',new THREE.Vector3(.12,.1,0),'#ffd975',.24));
const selector=document.querySelector('#triangle');patches.forEach((p,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${i+1}: F${faces[p.face].slice().sort().join('')} – ${p.a} – ${p.b}`;selector.append(option);});
// Coordinate arrows are guides at a selected patch, not added graph edges.
const axisArrows=[];for(const [i,name,color] of [[0,'x','#ff7979'],[1,'y','#88dc91'],[2,'z','#86baff']]){const d=new THREE.Vector3();d.setComponent(i,1);const a=new THREE.ArrowHelper(d,O,.55,color,.1,.045);const text=label(name,d.clone().multiplyScalar(.65),color,.22);axes.add(a,text);axisArrows.push({a,text,d});}
let step=0;
const descriptions=[
 'Start with the four labelled vertices A, B, C, D of one regular tetrahedron.',
 'Connect every pair in both directions: six geometric edges carry twelve directed primitive arrows.',
 'Derive one center F on each of the four faces. Joining F to the face’s three vertices produces three small triangles per face: twelve in total.',
 'Derive the body center O. Join O to each whole face: four tetrahedral pieces fill the original solid. Move the slider to inspect them.',
 'g = 12 counts the twelve small face-triangle placements. m = 3 counts the x, y, z spatial coordinates of each triangle’s mode—not three extra tetrahedra.'
];
const counts=['4 original vertices','6 geometric edges\n12 directed arrows','4 face centers\n4 × 3 = 12 small triangles','1 body center O\n4 face-to-center tetrahedra','g = 12 triangle placements\nm = 3 coordinates per placement\ngm = 36 coefficient coordinates'];
function render(){renderer.render(scene,camera);}
function update(){
 vertices.visible=true;edgeLines.visible=step>=1;arrows.visible=step===1;surface.visible=step===2||step===4;faceCenters.visible=step===2||step===4;solids.visible=step===3;centerGroup.visible=step===3;axes.visible=step===4;
 document.querySelector('#description').textContent=descriptions[step];document.querySelector('#counts').textContent=counts[step];document.querySelector('#explode-control').hidden=step!==3;document.querySelector('#triangle-control').hidden=step!==4;
 document.querySelectorAll('[data-step]').forEach(b=>{if(Number(b.dataset.step)===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
 document.querySelector('#previous').disabled=step===0;document.querySelector('#next').disabled=step===4;
 const amount=Number(document.querySelector('#explode').value);for(const {piece,center} of pieces)piece.position.copy(center).multiplyScalar(amount);
 const selected=Number(selector.value);patches.forEach((p,i)=>{p.mesh.material.opacity=step===4?(i===selected ? .75 : .1):.28;p.mesh.material.color.set(i===selected&&step===4?'#ffe29a':colors[p.face]);});
 const p=patches[selected];for(const {a,text,d} of axisArrows){a.position.copy(p.center);text.position.copy(p.center).addScaledVector(d,.65);}
 render();
}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{step=Number(b.dataset.step);update();}));
document.querySelector('#previous').addEventListener('click',()=>{step=Math.max(0,step-1);update();});document.querySelector('#next').addEventListener('click',()=>{step=Math.min(4,step+1);update();});
document.querySelector('#explode').addEventListener('input',update);selector.addEventListener('change',update);document.querySelector('#reset').addEventListener('click',()=>{controls.reset();document.querySelector('#explode').value='0';update();});controls.addEventListener('change',render);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});
if(patches.length!==12||pieces.length!==4||arrows.children.length!==12)throw new Error('Incorrect geometric construction counts');
update();
}catch(cause){error.hidden=false;error.textContent='Unable to display the scene. Internet access to jsDelivr and WebGL are required. '+cause.message;console.error(cause);}
</script>
</body>
</html>
