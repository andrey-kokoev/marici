<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Two dual simplex structures meeting at six incidences</title>
  <desc id="desc">Incidence schematic of two dual simplex structures. Each outer one labels the closure witness of the whole bracketed configuration; neither is an additional vertex. Four vertices on each side meet through six complementary edge pairs. Bidirectional arrows depict the proposed flow, not additional geometric edges.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:system-ui,sans-serif;fill:#e2e8f0;text-anchor:middle}
      .edge{fill:none;stroke:#64748b;stroke-width:1.4;marker-start:url(#arrow);marker-end:url(#arrow);opacity:.65}
      .left{fill:#122b40;stroke:#38bdf8;stroke-width:2}
      .right{fill:#302044;stroke:#c084fc;stroke-width:2}
      .middle{fill:#19382f;stroke:#6ee7b7;stroke-width:2}
      .count{font-size:32px;font-weight:650}.label{font-size:16px}.small{font-size:14px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1100" height="620" rx="18" fill="#0f172a"/>
  <text x="550" y="42" font-size="24">Two dual simplices · shared incidence layer</text>
  <g class="count"><text x="90" y="94">1</text><text x="300" y="94">4</text><text x="550" y="94">6</text><text x="800" y="94">4</text><text x="1010" y="94">1</text></g>
  <g class="edge">
    <path d="M322 169 L496 153 M322 177 L496 217 M319 184 L496 283"/>
    <path d="M320 258 L496 158 M322 269 L496 348 M318 282 L496 410"/>
    <path d="M318 345 L496 223 M322 357 L496 353 M319 373 L496 473"/>
    <path d="M319 438 L496 288 M322 446 L496 418 M322 455 L496 478"/>
    <path d="M604 153 L782 345 M604 158 L782 438"/>
    <path d="M604 217 L778 258 M604 223 L778 442"/>
    <path d="M604 283 L778 269 M604 288 L778 352"/>
    <path d="M604 348 L778 177 M604 353 L778 449"/>
    <path d="M604 410 L778 182 M604 418 L778 363"/>
    <path d="M604 473 L778 186 M604 478 L778 280"/>
  </g>
  <!-- Group brackets, not edges: each outer 1 describes the whole configuration. -->
  <path d="M258 140 H240 V480 H258" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M842 140 H860 V480 H842" fill="none" stroke="#c084fc" stroke-width="2"/>
  <g class="label"><text x="120" y="301">Closure witness</text><text x="120" y="327">of the whole</text><text x="120" y="353">left simplex</text><text x="980" y="301">Closure witness</text><text x="980" y="327">of the whole</text><text x="980" y="353">right simplex</text></g>
  <g class="left"><circle cx="300" cy="175" r="23"/><circle cx="300" cy="270" r="23"/><circle cx="300" cy="360" r="23"/><circle cx="300" cy="445" r="23"/></g>
  <g class="right"><circle cx="800" cy="175" r="23"/><circle cx="800" cy="270" r="23"/><circle cx="800" cy="360" r="23"/><circle cx="800" cy="445" r="23"/></g>
  <g class="middle"><rect x="500" y="136" width="100" height="34" rx="17"/><rect x="500" y="201" width="100" height="34" rx="17"/><rect x="500" y="266" width="100" height="34" rx="17"/><rect x="500" y="331" width="100" height="34" rx="17"/><rect x="500" y="396" width="100" height="34" rx="17"/><rect x="500" y="461" width="100" height="34" rx="17"/></g>
  <g class="label"><text x="300" y="181">1</text><text x="300" y="276">2</text><text x="300" y="366">3</text><text x="300" y="451">4</text><text x="800" y="181">1*</text><text x="800" y="276">2*</text><text x="800" y="366">3*</text><text x="800" y="451">4*</text><text x="550" y="159">12 ↔ 34*</text><text x="550" y="224">13 ↔ 24*</text><text x="550" y="289">14 ↔ 23*</text><text x="550" y="354">23 ↔ 14*</text><text x="550" y="419">24 ↔ 13*</text><text x="550" y="484">34 ↔ 12*</text></g>
  <g class="small"><text x="110" y="530">Not an extra vertex</text><text x="300" y="530">Vertices</text><text x="550" y="530">Paired edges / six stitches</text><text x="800" y="530">Dual vertices (faces)</text><text x="990" y="530">Not an extra vertex</text><text x="550" y="574">Inward: expose incidence data · Outward: assemble with supplied compatibility / fillers</text><text x="550" y="598">Brackets denote whole structures · Arrows denote incidence / proposed flow, not geometric edges</text></g>
</svg>
