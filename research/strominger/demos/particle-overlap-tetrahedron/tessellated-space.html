<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tessellated realization space</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b1218;color:#e8f1f3;font:15px system-ui}main{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:1fr}#scene{grid-column:1;grid-row:1;position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%}#readout{min-width:0;overflow-wrap:anywhere;grid-column:2;grid-row:1;box-sizing:border-box;padding:18px 16px;background:#111d25;border-left:1px solid #253944;display:flex;flex-direction:column;align-items:stretch;gap:16px;overflow-y:auto}#readout nav{display:grid;gap:8px}#readout button{background:#1a2b35;color:#e8f1f3;border:1px solid #54707d;border-radius:5px;padding:9px;text-align:left}#readout button[aria-pressed=true]{border-color:#a4efd0;color:#a4efd0}#readout label{display:grid;gap:8px}#readout select{min-width:0;width:100%;background:#17232b;color:#e8f1f3;padding:8px}#grid-extent{width:100%;vertical-align:middle}#grid-extent-value{font-size:12px;color:#a4efd0}#summary{line-height:1.5;color:#c2d2d8}#loading,#error{position:absolute;top:12px;left:12px}#error{color:#ff9c9c}@media(max-width:760px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(55dvh,1fr) auto}#scene{grid-column:1;grid-row:1}#readout{grid-column:1;grid-row:2;border-left:0;border-top:1px solid #253944;overflow:visible;padding:12px;gap:10px}#readout nav{grid-template-columns:1fr 1fr}#readout button{text-align:center}#readout label{grid-template-columns:110px minmax(0,1fr);align-items:center}#grid-extent-value{grid-column:2}}</style></head>
<body><main><div id="scene"><div id="loading">Loading tessellated space…</div><div id="error" role="alert" hidden></div></div><div id="readout"><a href="/experiments/isotope-space" style="color:#a4efd0">← Viewer guide</a><nav aria-label="View mode"><button type="button" data-view="isotope">Isotope construction</button><button type="button" data-view="space">R-space tessellation</button></nav><label>Isotope <select id="isotope"></select></label><label>Grid context <input id="grid-extent" type="range" min="0" max="8" step="1" value="4"><output id="grid-extent-value">4 cell layers</output></label><span id="summary" role="status" aria-live="polite">Drag to orbit · scroll to zoom</span><button id="retry" type="button" hidden>Retry construction</button><small>Drag to orbit · scroll or pinch to zoom. The two views use distinct coordinate frames; no isotope placement in R-space is asserted.</small></div></main>
<script src="./vendor/three.min.js"></script><script src="./vendor/OrbitControls.js"></script><script type="module" src="./tessellated-space-viewer.js"></script></body></html>
