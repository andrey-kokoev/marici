<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1f2937"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      .grade{fill:#eef2ff;stroke:#3730a3;stroke-width:2.5}.horn{fill:#fff;stroke:#111827;stroke-width:2.3}.test{fill:#faf5ff;stroke:#7c3aed;stroke-width:2.3}.projection{fill:none;stroke:#1f2937;stroke-width:2.2;marker-end:url(#arrow)}.filler{fill:none;stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#purpleArrow)}
      .title{font:600 25px system-ui,sans-serif;fill:#111827}.section{font:600 19px system-ui,sans-serif;fill:#374151}.name{font:600 19px system-ui,sans-serif;fill:#111827}.label{font:17px system-ui,sans-serif;fill:#111827}.small{font:15px system-ui,sans-serif;fill:#4b5563}.purple{font:16px system-ui,sans-serif;fill:#6d28d9}
    </style>
  </defs>
  <rect width="1400" height="940" fill="#fafafa"/>
  <text x="40" y="45" class="title">Inner-horn presentation of the arity-indexed constructor</text>

  <text x="55" y="88" class="section">Grades</text>
  <rect x="70" y="125" width="400" height="105" rx="12" class="grade"/>
  <text x="100" y="162" class="name">V₁</text><text x="180" y="162" class="label">arity 1</text><text x="100" y="198" class="small">Xᵢ: vertices</text>
  <rect x="70" y="305" width="400" height="105" rx="12" class="grade"/>
  <text x="100" y="342" class="name">V₂</text><text x="180" y="342" class="label">arity 2</text><text x="100" y="378" class="small">Xᵢⱼ: conductors</text>
  <rect x="70" y="485" width="400" height="105" rx="12" class="grade"/>
  <text x="100" y="522" class="name">V₃</text><text x="180" y="522" class="label">arity 3</text><text x="100" y="558" class="small">Xᵢⱼₖ: triangular coherence planes</text>
  <rect x="70" y="665" width="400" height="105" rx="12" class="grade"/>
  <text x="100" y="702" class="name">V₄</text><text x="180" y="702" class="label">arity 4</text><text x="100" y="738" class="small">Xᵢⱼₖₗ: tetrahedral coherencers</text>

  <text x="565" y="88" class="section">Inner horns and fillers</text>
  <rect x="550" y="485" width="410" height="105" rx="12" class="horn"/>
  <text x="580" y="522" class="name">Λ²₁</text><text x="665" y="522" class="label">two composable conductors</text>
  <text x="580" y="558" class="small">the composite face is missing</text>
  <path d="M470 520 L549 520" class="projection"/>
  <path d="M550 562 L471 562" class="filler"/>

  <rect x="550" y="635" width="410" height="105" rx="12" class="horn"/>
  <text x="580" y="672" class="name">Λ³₁</text><text x="665" y="672" class="label">inner tetrahedral horn</text>
  <text x="580" y="708" class="small">face 1 is missing</text>
  <path d="M470 680 L549 680" class="projection"/>
  <path d="M550 712 L471 712" class="filler"/>

  <rect x="550" y="765" width="410" height="105" rx="12" class="horn"/>
  <text x="580" y="802" class="name">Λ³₂</text><text x="665" y="802" class="label">inner tetrahedral horn</text>
  <text x="580" y="838" class="small">face 2 is missing</text>
  <path d="M470 725 C500 750 520 800 549 800" class="projection"/>
  <path d="M550 842 C520 855 500 750 471 748" class="filler"/>

  <line x1="1010" y1="80" x2="1010" y2="880" stroke="#d1d5db" stroke-width="2"/>
  <text x="1050" y="88" class="section">Filler fibers</text>
  <rect x="1040" y="135" width="315" height="135" rx="12" class="test"/>
  <text x="1070" y="175" class="name">No filler</text><text x="1070" y="215" class="label">empty fiber</text><text x="1070" y="244" class="small">the horn is not admitted</text>
  <rect x="1040" y="320" width="315" height="135" rx="12" class="test"/>
  <text x="1070" y="360" class="name">Determined filler</text><text x="1070" y="400" class="label">contractible fiber</text><text x="1070" y="429" class="small">one filler up to its higher paths</text>
  <rect x="1040" y="505" width="315" height="135" rx="12" class="test"/>
  <text x="1070" y="545" class="name">Ambiguous filler</text><text x="1070" y="585" class="label">noncontractible fiber</text><text x="1070" y="614" class="small">distinct completions remain</text>
  <rect x="1040" y="690" width="315" height="135" rx="12" class="test"/>
  <text x="1070" y="730" class="name">Category tests</text><text x="1070" y="770" class="small">inner horns: fillers required</text><text x="1070" y="799" class="small">ordinary category: unique fillers</text>

  <line x1="55" y1="890" x2="1345" y2="890" stroke="#d1d5db" stroke-width="2"/>
  <text x="55" y="918" class="small">Solid arrows omit the named face; dashed arrows are partial fillers. No inner horn exists at arity two. Degeneracies are not included.</text>
</svg>
