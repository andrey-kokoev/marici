<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-labelledby="title desc"><title id="title">A marked packet and twelve coherence sectors</title><desc id="desc">Three coordinate sheets with four signed sectors each meet at the label l. These are configuration directions, not physical spatial axes.</desc><rect width="660" height="460" rx="16" fill="#101827"/><g font-family="system-ui,sans-serif" fill="#edf3fa" font-size="20"><polygon data-sector="0:-1:-1" points="330,220 330,345 445,283 445,158" fill="#c59bff" fill-opacity=".18" stroke="#c59bff" stroke-width="2"/><polygon data-sector="0:-1:1" points="330,220 330,345 215,407 215,282" fill="#c59bff" fill-opacity=".18" stroke="#c59bff" stroke-width="2"/><polygon data-sector="0:1:-1" points="330,220 330,95 445,33 445,158" fill="#c59bff" fill-opacity=".18" stroke="#c59bff" stroke-width="2"/><polygon data-sector="0:1:1" points="330,220 330,95 215,157 215,282" fill="#c59bff" fill-opacity=".18" stroke="#c59bff" stroke-width="2"/><polygon data-sector="1:-1:-1" points="330,220 215,158 330,96 445,158" fill="#ffc179" fill-opacity=".18" stroke="#ffc179" stroke-width="2"/><polygon data-sector="1:-1:1" points="330,220 215,158 100,220 215,282" fill="#ffc179" fill-opacity=".18" stroke="#ffc179" stroke-width="2"/><polygon data-sector="1:1:-1" points="330,220 445,282 560,220 445,158" fill="#ffc179" fill-opacity=".18" stroke="#ffc179" stroke-width="2"/><polygon data-sector="1:1:1" points="330,220 445,282 330,344 215,282" fill="#ffc179" fill-opacity=".18" stroke="#ffc179" stroke-width="2"/><polygon data-sector="2:-1:-1" points="330,220 215,158 215,283 330,345" fill="#78d6e8" fill-opacity=".18" stroke="#78d6e8" stroke-width="2"/><polygon data-sector="2:-1:1" points="330,220 215,158 215,33 330,95" fill="#78d6e8" fill-opacity=".18" stroke="#78d6e8" stroke-width="2"/><polygon data-sector="2:1:-1" points="330,220 445,282 445,407 330,345" fill="#78d6e8" fill-opacity=".18" stroke="#78d6e8" stroke-width="2"/><polygon data-sector="2:1:1" points="330,220 445,282 445,157 330,95" fill="#78d6e8" fill-opacity=".18" stroke="#78d6e8" stroke-width="2"/><path d="M330 220L445 282" stroke="#eff5ff" stroke-width="3"/><circle cx="445" cy="282" r="4" fill="#eff5ff"/><text x="480.6" y="291.88">a</text><path d="M330 220L330 95" stroke="#eff5ff" stroke-width="3"/><circle cx="330" cy="95" r="4" fill="#eff5ff"/><text x="338" y="60">b</text><path d="M330 220L215 282" stroke="#eff5ff" stroke-width="3"/><circle cx="215" cy="282" r="4" fill="#eff5ff"/><text x="195.4" y="291.88">c</text><circle cx="330" cy="220" r="8" fill="#ffe4a0"/><text x="340" y="245">l</text><text x="24" y="35" font-size="16">one mark · three directions · twelve signed sectors</text><text x="24" y="435" font-size="14" fill="#b8cada">Proposed configuration-space primitive · n = 3</text></g></svg>
