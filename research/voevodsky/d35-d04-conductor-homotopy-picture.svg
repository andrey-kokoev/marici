<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#111"/></marker>
  <style>
    .t{font:24px Georgia,serif;fill:#111}.h{font:20px Georgia,serif;font-weight:bold;fill:#111}.m{font:20px Georgia,serif;font-style:italic;fill:#111}.s{font:16px Georgia,serif;fill:#111}.a{stroke:#111;stroke-width:1.7;fill:none;marker-end:url(#arr)}.d{stroke:#111;stroke-width:1.5;fill:none;stroke-dasharray:6 5;marker-end:url(#arr)}.box{fill:#fff;stroke:#111;stroke-width:1.2}.pb{fill:none;stroke:#111;stroke-width:1.5}.new{fill:#f4faf7;stroke:#285943;stroke-width:1.4}.g{fill:#285943}.ga{stroke:#285943;stroke-width:1.8;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<rect width="1200" height="900" fill="white"/>
<text x="600" y="45" text-anchor="middle" class="t">Conductor correspondences and the marked homotopy pullbacks</text>

<!-- A -->
<text x="70" y="92" class="h">(A) Normalization–conductor square</text>
<text x="235" y="165" text-anchor="middle" class="m">Z̃ = Z₊ ⊔ Z₋</text>
<text x="545" y="165" text-anchor="middle" class="m">F̃ = F₊ ⊔ F₋</text>
<text x="235" y="315" text-anchor="middle" class="m">Z = Spec C</text>
<text x="545" y="315" text-anchor="middle" class="m">F = Spec B</text>
<path d="M330 158H445" class="a"/><text x="388" y="145" text-anchor="middle" class="m">ĩ</text>
<path d="M235 180V280" class="a"/><text x="215" y="235" class="m">p</text>
<path d="M545 180V280" class="a"/><text x="562" y="235" class="m">ν</text>
<path d="M320 308H450" class="a"/><text x="386" y="296" text-anchor="middle" class="m">i</text>
<path d="M340 260h16v16" class="pb"/>
<text x="70" y="355" class="s">Cartesian; ν is finite and an isomorphism over F ∖ Z.</text>

<!-- B -->
<text x="660" y="92" class="h">(B) Two marked first-conormal legs</text>
<text x="785" y="175" text-anchor="middle" class="m">Tot(N∨₃₅)</text>
<text x="1015" y="175" text-anchor="middle" class="m">Tot(N∨₀₄)</text>
<text x="900" y="300" text-anchor="middle" class="m">Z</text>
<path d="M800 190L875 275" class="a"/><text x="817" y="238" class="m">p₃₅</text>
<path d="M1000 190L925 275" class="a"/><text x="967" y="238" class="m">p₀₄</text>
<path d="M900 315V355" class="a"/><text x="916" y="342" class="m">i</text>
<text x="900" y="385" text-anchor="middle" class="m">F</text>
<path d="M810 130Q900 92 990 130" class="d"/>
<text x="900" y="118" text-anchor="middle" class="m">s</text>
<text x="700" y="345" class="s">N∨ₖ = (Jₖ/Jₖ²)∨,  k ∈ {35,04}</text>

<line x1="60" y1="410" x2="1140" y2="410" stroke="#777" stroke-width="1"/>

<!-- C -->
<text x="70" y="458" class="h">(C) Coefficient image of each marked correspondence</text>

<!-- D35 square -->
<text x="285" y="505" text-anchor="middle" class="h">k = 35</text>
<text x="160" y="570" text-anchor="middle" class="m">D₃₅</text>
<text x="430" y="570" text-anchor="middle" class="m">Eβ,₃₅ ⊗ Π∨[3]</text>
<text x="160" y="700" text-anchor="middle" class="m">ω[2]</text>
<text x="430" y="700" text-anchor="middle" class="m">C ⊗ Π∨[3]</text>
<path d="M195 563H335" class="a"/>
<path d="M160 583V670" class="a"/>
<path d="M430 583V670" class="a"/><text x="445" y="630" class="m">π₃₅</text>
<path d="M205 693H370" class="a"/><text x="288" y="680" text-anchor="middle" class="m">q</text>
<path d="M180 595h15v15" class="pb"/>

<!-- D04 square -->
<text x="895" y="505" text-anchor="middle" class="h">k = 04</text>
<text x="770" y="570" text-anchor="middle" class="m">D₀₄</text>
<text x="1040" y="570" text-anchor="middle" class="m">Eβ,₀₄ ⊗ Π∨[3]</text>
<text x="770" y="700" text-anchor="middle" class="m">ω[2]</text>
<text x="1040" y="700" text-anchor="middle" class="m">C ⊗ Π∨[3]</text>
<path d="M805 563H945" class="a"/>
<path d="M770 583V670" class="a"/>
<path d="M1040 583V670" class="a"/><text x="1055" y="630" class="m">π₀₄</text>
<path d="M815 693H980" class="a"/><text x="898" y="680" text-anchor="middle" class="m">q</text>
<path d="M790 595h15v15" class="pb"/>

<path d="M500 555Q600 505 700 555" class="d"/>
<text x="600" y="525" text-anchor="middle" class="s">reflection transports the labelled pullback</text>

<!-- strict model -->
<rect x="165" y="755" width="870" height="105" rx="2" class="box"/>
<text x="600" y="785" text-anchor="middle" class="m">Dₖⁿ = ω[2]ⁿ ⊕ (Eβ,ₖΠ∨[3])ⁿ ⊕ (CΠ∨[3])ⁿ⁻¹</text>
<text x="600" y="820" text-anchor="middle" class="m">d(z,e,h) = (dωz, dEe, qz − πₖe − dCh)</text>
<text x="600" y="848" text-anchor="middle" class="s">The third coordinate h is the specified homotopy between the two composites to the conductor.</text>

<line x1="60" y1="890" x2="1140" y2="890" stroke="#777" stroke-width="1"/>
<text x="70" y="930" class="h">(D) Compiled detector orientation</text>
<rect x="70" y="950" width="1060" height="125" rx="3" class="new"/>
<text x="150" y="985" text-anchor="middle" class="m">bσ,T</text>
<text x="385" y="985" text-anchor="middle" class="m">v ∈ ker(πₖ),  Qv = 0</text>
<text x="675" y="985" text-anchor="middle" class="m">Xᵥ = ∂ᵥ,  [Q,Xᵥ] = 0</text>
<text x="1000" y="985" text-anchor="middle" class="m">φᵥ(λᵥ,1) = −1</text>
<path d="M195 978H275" class="ga"/>
<path d="M505 978H565" class="ga"/>
<path d="M805 978H895" class="ga"/>
<text x="600" y="1025" text-anchor="middle" class="s g">q(p∨E,O) = −1, q(κ) = 1; eight strict framed maps; sixfold supported residue</text>
<text x="600" y="1055" text-anchor="middle" class="s g">Every boundary vanishes on (λᵥ,1), so [φᵥ] ≠ 0 in the algebraic continuous-formal cyclic complex.</text>
<text x="600" y="1100" text-anchor="middle" class="s">Rotated global target: off-critical states cannot evade the jointly conservative family of lawful detectors.</text>
</svg>
