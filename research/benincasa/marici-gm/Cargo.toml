[package]
name = "marici-gm"
version = "0.1.0"
edition = "2021"

[dependencies]
symbolica = { version = "2.2.0", default-features = false, features = ["no_gmp"] }
serde_json = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[features]
replication-prime = []
reconstruction-prime-3 = []
verification-prime-4 = []

[profile.release]
lto = "thin"
codegen-units = 1
