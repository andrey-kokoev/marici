<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc">
<title id="title">Categorical presentation of the tetrahedral schedule groupoid</title><desc id="desc">Objects are the 24 permutations of four contractions. Three adjacent-swap generators obey one distant-commutation square and two braid hexagons.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#8ecce8"/></marker></defs>
<style>.bg{fill:#071117}.panel{fill:#0c1b23;stroke:#29414c;stroke-width:1.5}.obj{fill:#14303b;stroke:#8ecce8;stroke-width:1.7}.txt{fill:#edf5f7;font:14px ui-monospace;text-anchor:middle}.small{fill:#a9bec7;font:12px system-ui}.head{fill:#edf5f7;font:600 24px system-ui}.sub{fill:#9eb2bb;font:14px system-ui}.ph{fill:#79c8e8;font:600 15px system-ui}.arrow{stroke:#8ecce8;stroke-width:1.8;fill:none;marker-end:url(#a)}.cell{fill:#78d9a8;opacity:.12;stroke:#78d9a8;stroke-dasharray:5 4}.rel{fill:#78d9a8;font:13px ui-monospace;text-anchor:middle}.missing{fill:#191c29;stroke:#ff9f71;stroke-width:1.7;stroke-dasharray:7 5}.mh{fill:#ffb28e;font:600 14px system-ui}.mtext{fill:#d9c2b7;font:12px system-ui}.formula{fill:#f1d3c5;font:13px ui-monospace;text-anchor:middle}.conditional{fill:#ffb28e;font:12px system-ui}</style>
<rect class="bg" width="1200" height="1260"/><text class="head" x="38" y="42">Tetrahedral complete-schedule category · presentation</text><text class="sub" x="38" y="68">Within a typed polarization, 24 flags are generated by adjacent swaps. Reciprocal sewing transports between opposite source relations rather than acting on one carrier.</text>
<rect class="panel" x="30" y="92" width="1140" height="150" rx="12"/><text class="ph" x="52" y="120">OBJECTS AND GENERATORS</text>
<rect class="obj" x="70" y="150" width="190" height="54" rx="8"/><text class="txt" x="165" y="182">[a | b | c | d]</text>
<path class="arrow" d="M280 177H410"/><text class="small" x="324" y="164">s₁</text><rect class="obj" x="425" y="150" width="190" height="54" rx="8"/><text class="txt" x="520" y="182">[b | a | c | d]</text>
<path class="arrow" d="M635 177H765"/><text class="small" x="680" y="164">s₂</text><rect class="obj" x="780" y="150" width="190" height="54" rx="8"/><text class="txt" x="875" y="182">[b | c | a | d]</text>
<text class="small" x="990" y="164">s₃ swaps slots 3 and 4</text><text class="small" x="990" y="187">Orbit: all 4! = 24 schedules</text><text class="small" x="70" y="225">After localization each admitted sᵢ is invertible. Typing may prohibit swaps; displayed arrows are composition order, not physical time.</text>
<rect class="panel" x="30" y="262" width="555" height="330" rx="12"/><text class="ph" x="52" y="291">DISTANT INTERCHANGE</text>
<polygon class="cell" points="145,340 465,340 465,510 145,510"/><rect class="obj" x="75" y="318" width="140" height="44" rx="7"/><text class="txt" x="145" y="345">abcd</text><rect class="obj" x="395" y="318" width="140" height="44" rx="7"/><text class="txt" x="465" y="345">bacd</text><rect class="obj" x="75" y="488" width="140" height="44" rx="7"/><text class="txt" x="145" y="515">abdc</text><rect class="obj" x="395" y="488" width="140" height="44" rx="7"/><text class="txt" x="465" y="515">badc</text>
<path class="arrow" d="M215 340H385"/><text class="small" x="295" y="329">s₁</text><path class="arrow" d="M145 362V478"/><text class="small" x="155" y="425">s₃</text><path class="arrow" d="M465 362V478"/><text class="small" x="475" y="425">s₃</text><path class="arrow" d="M215 510H385"/><text class="small" x="295" y="499">s₁</text><text class="rel" x="305" y="432">s₁s₃ ≃ s₃s₁</text><text class="small" x="75" y="565">Independent contractions commute through an interchange 2-cell.</text>
<rect class="panel" x="605" y="262" width="565" height="330" rx="12"/><text class="ph" x="627" y="291">BRAID COHERENCE</text>
<polygon class="cell" points="875,318 1040,385 1040,485 875,552 710,485 710,385"/><g class="txt"><rect class="obj" x="820" y="300" width="110" height="40" rx="7"/><text x="875" y="326">abcd</text><rect class="obj" x="985" y="365" width="110" height="40" rx="7"/><text x="1040" y="391">bacd</text><rect class="obj" x="985" y="465" width="110" height="40" rx="7"/><text x="1040" y="491">bcad</text><rect class="obj" x="820" y="532" width="110" height="40" rx="7"/><text x="875" y="558">cbad</text><rect class="obj" x="655" y="465" width="110" height="40" rx="7"/><text x="710" y="491">cabd</text><rect class="obj" x="655" y="365" width="110" height="40" rx="7"/><text x="710" y="391">acbd</text></g>
<path class="arrow" d="M925 340L985 365"/><path class="arrow" d="M1040 405V455"/><path class="arrow" d="M985 505L930 530"/><path class="arrow" d="M765 505L820 532"/><path class="arrow" d="M710 405V455"/><path class="arrow" d="M820 340L765 365"/><text class="rel" x="875" y="430">s₁s₂s₁</text><text class="rel" x="875" y="452">≃ s₂s₁s₂</text><text class="small" x="646" y="580">A second hexagon uses s₂ and s₃.</text>
<rect class="panel" x="30" y="612" width="1140" height="210" rx="12"/><text class="ph" x="52" y="642">POLARIZED LOCALIZATION · COMMON PROFILE NOT YET FORMED</text>
<rect class="obj" x="72" y="660" width="230" height="52" rx="8"/><text class="txt" x="187" y="683">P₊ · L₊: q+p=0</text><text class="small" x="105" y="703">typed positive schedule fiber</text>
<rect class="obj" x="72" y="748" width="230" height="52" rx="8"/><text class="txt" x="187" y="771">P₋ · L₋: q−p=0</text><text class="small" x="105" y="791">transported negative schedule fiber</text>
<path class="arrow" d="M320 682H470"/><text class="conditional" x="338" y="669">local completion only</text><rect class="obj" x="485" y="658" width="92" height="48" rx="24"/><text class="txt" x="531" y="688">*₊</text>
<path class="arrow" d="M320 770H470"/><text class="conditional" x="338" y="757">local completion only</text><rect class="obj" x="485" y="746" width="92" height="48" rx="24"/><text class="txt" x="531" y="776">*₋</text>
<path class="arrow" d="M202 716V738"/><text class="small" x="213" y="731">W</text><path class="arrow" d="M170 738V716"/><text class="small" x="135" y="731">W</text><text class="rel" x="390" y="727">W² ⇒ id</text>
<rect class="missing" x="650" y="660" width="475" height="140" rx="10"/><text class="mh" x="670" y="688">COMMON SCC PROFILE FIBER Cₐ ?</text><text class="formula" x="888" y="721">α(c₊)=a=α(c₋)</text><text class="mtext" x="675" y="751">Requires a common carrier, behavioral observer,</text><text class="mtext" x="675" y="773">uniform estimate, and typed reciprocal transport.</text><path class="arrow" d="M588 682H640"/><path class="arrow" d="M588 770H640"/>
<rect class="panel" x="30" y="842" width="1140" height="380" rx="12"/><text class="ph" x="52" y="873">REQUIRED BEFORE THE SIMPLIFICATION ARROW IS LICENSED</text>
<rect class="missing" x="55" y="898" width="250" height="132" rx="10"/><text class="mh" x="72" y="925">1 · INVERSE WITNESSES</text><text class="formula" x="180" y="963">sᵢ² ⇒ id</text><path class="arrow" d="M110 994 C110 955 250 955 250 994"/><text class="mtext" x="79" y="1015">for i = 1, 2, 3</text>
<rect class="missing" x="325" y="898" width="250" height="132" rx="10"/><text class="mh" x="342" y="925">2 · SECOND BRAID CELL</text><text class="formula" x="450" y="963">s₂s₃s₂ ⇒ s₃s₂s₃</text><polygon class="cell" points="385,990 415,970 485,970 515,990 485,1010 415,1010"/><text class="mtext" x="349" y="1018">not merely the prose mention</text>
<rect class="missing" x="595" y="898" width="550" height="132" rx="10"/><text class="mh" x="612" y="925">3 · RELATION-AMONG-RELATIONS FILLER</text><text class="formula" x="870" y="960">Ω₃ : ∂(permutohedral bulk) ⇒ 0</text><text class="mtext" x="620" y="990">interchange square + both braid hexagons + inverse cells</text><path class="arrow" d="M760 1007H975"/><text class="conditional" x="791" y="1023">required 3-cell</text>
<rect class="missing" x="55" y="1050" width="520" height="142" rx="10"/><text class="mh" x="72" y="1077">4 · TYPED MARICI ASSIGNMENT</text><text class="formula" x="315" y="1112">{a,b,c,d} → {S,R,S∨,R∨}</text><text class="mtext" x="78" y="1143">A schedule orders the flag vertex ⊂ edge ⊂ face ⊂ bulk.</text><text class="mtext" x="78" y="1164">Exact maps, dependencies, pairings, and swap authority remain required.</text>
<rect class="missing" x="595" y="1050" width="550" height="142" rx="10"/><text class="mh" x="612" y="1077">5 · TARGET EVALUATION AND PROFILE ADAPTER</text><text class="formula" x="870" y="1112">Ev± : P± → C±</text><text class="formula" x="870" y="1141">α(c±)=a</text><text class="mtext" x="620" y="1170">W must transport L₊ to L₋; it is not a same-range endomorphism.</text>
<text class="conditional" x="52" y="1243">Dashed orange cells are obligations, not constructed data. If one fails, S₄ // S₄ must not be collapsed to one schedule.</text></svg>
