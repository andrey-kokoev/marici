schema = "marici.coherence-lattice.v2"

[lattice]
id = "tower-reconciler-flag"
title = "Tower and reconciler flag"
formation = "contiguous_interval"
orientation = "bottom_to_top"
object_count = 8
max_witnessed_column = 1

[constructor]
name = "typed_overlap_reconciler"
arity = 2
partial = true
input_rule = "C(p-1,i), C(p-1,i+1)"
shared_face = "C(p-2,i+1)"
output_rule = "C(p,i)"
preserves_inputs = true
requires_shared_face_agreement = true

[operational_semantics]
classification = "constructor_observer_behavior"
domain_identity = "verified_constructor_equivalence"
domain_components_are_derived = true
scalar_equality_is_insufficient = true
completion_is_part_of_domain_identity = true
observer_atlas = "observer-atlas.toml"

[scc_classifier]
scales = [
  "local",
  "packet",
  "finite_system",
  "pro_system",
  "completion",
]
carrier = ["absent", "split", "compatible"]
action = ["absent", "typed", "faithful"]
observation = ["absent", "natural", "faithful"]
estimate = ["absent", "bounded", "uniform"]
profile_count = 405
assignment_rule = "record only occupied profiles; do not enumerate the classifier product"

[[realization_index]]
id = "theta_tate"
over = "theta_tate_cell.id"
status = "schema_only"
structural_authority = "rung, reconciler, edge_type, and boundary_word tables"
secondary_overlay = "theta_tate_cell"
required_slots = [
  "state_object_ref",
  "constructor_family_refs",
  "observation_family_refs",
  "completion_ref",
]
rule = "the secondary overlay may label a realization but may not supply structural authority"

[[transport_index]]
id = "canonical_faces"
realization_index = "theta_tate"
over = "edge_type"
status = "uninstantiated"
required_slots = [
  "constructor_transport_ref",
  "observation_transport_ref",
]
rule = "a realization transport must lift one declared L or R face map"

[[comparison_type]]
id = "constructor_equivalence"
required_slots = [
  "state_map_ref",
  "constructor_intertwiner_ref",
  "observer_intertwiner_ref",
  "inverse_ref",
]
rule = "verified comparisons generate operational-domain components"

[[comparison_type]]
id = "scalar_equivalence"
required_slots = ["scalar_map_ref"]
rule = "diagnostic only; never generates operational-domain components"

[[domain_wall_type]]
id = "observability"
witness = "behavioral joint kernel changes"

[[domain_wall_type]]
id = "controllability"
witness = "authorized constructor orbits change"

[[domain_wall_type]]
id = "authority"
witness = "no source-authorized common comparison context exists"

[[domain_wall_type]]
id = "holonomy"
witness = "a typed boundary word has nonidentity constructor residue"

[[domain_wall_type]]
id = "completion"
witness = "finite separation exists but its uniform lower margin collapses"

[[derivation_rule]]
id = "operational_domain_components"
vertices = "instantiated realizations"
edges = "verified constructor_equivalence comparisons"
output = "connected components after inversion of verified equivalences"

[[derivation_rule]]
id = "first_domain_wall"
order = "declared dependency order, then scale order, then cell index"
output = "the first typed failed witness on a path between realization components"

[[edge_type]]
id = "L"
label = "left face"
source = "C(p,i)"
target = "C(p-1,i)"
orientation = "outward"

[[edge_type]]
id = "R"
label = "right face"
source = "C(p,i)"
target = "C(p-1,i+1)"
orientation = "outward"

[[boundary_word]]
id = "shared_face_diamond"
minimum_column = 2
route_a = "L > R"
route_b = "R > L"
common_target = "C(p-2,i+1)"

[[coefficient_lens]]
id = "additive"
formula = "R∘L − L∘R"
flat_identity = "0"

[[coefficient_lens]]
id = "phase"
formula = "det(R∘L) / det(L∘R)"
flat_identity = "1"

[[coefficient_lens]]
id = "ordered"
formula = "(R∘L) ∘ (L∘R)⁻¹"
flat_identity = "I"

