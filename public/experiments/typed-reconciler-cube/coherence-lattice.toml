[[law]]
id = "typed_ports"
statement = "Interactions are admitted only when source, target, and shared-face types agree."

[[law]]
id = "constructor_confluence"
statement = "Competing reduction orders require a constructor-level witness, not scalar equality alone."

[[law]]
id = "twisted_associator"
statement = "For x star y = omega(x,y)xy, strict confluence is the two-cocycle law for omega."

[[law]]
id = "same_profile_fiber"
statement = "Equal SCC profiles identify certification strength, not constructor equivalence; operational domains are components of the verified realization-intertwiner groupoid."

[[law]]
id = "fiber_intertwiner"
statement = "A realization-fiber comparison must intertwine named constructors, observations, viewing strength, authority, completion, and instrument backaction."

[[falsifier]]
id = "scalar_only_apex"
condition = "Competing apex constructors differ although their scalar projections agree."

[[falsifier]]
id = "untyped_adjacency"
condition = "A reconciler is formed without equality on the declared shared face."

[[falsifier]]
id = "same_profile_inequivalent_realizations"
condition = "Two systems occupy one SCC profile but their named constructor representations admit no invertible intertwiner."

