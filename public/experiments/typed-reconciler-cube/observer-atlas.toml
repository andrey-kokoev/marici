schema = "marici.observer-atlas.v1"

[atlas]
base = "coherence-lattice.toml"
sample_unit = "instrument_in_declared_context"
profile_order = ["carrier", "action", "observation", "estimate"]
profile_values = ["absent", "intermediate", "strong"]
unknown_is_not_zero = true

[viewing_strength]
behavioral_map = "B_P(x) = (O alpha x) over every admitted observation O and authorized constructor word alpha"
gramian = "W_P = B_P* B_P"
ordered_spectrum = "lambda_1 >= ... >= lambda_n >= 0"
operational_quotient = "X / ker(W_P)"
faithfulness = "lambda_n > 0"
completion_stability = "inf_N lambda_min(W_P,N) > 0"
joint_rule = "sum transported Gramians only inside one source-authorized common frame"
sequential_rule = "close observations under constructor words before forming the Gramian"
undefined_join_rule = "an unauthorized or untyped common frame makes joint strength undefined, not zero"

[coefficient_realizations]
hilbert_linear = "ordered eigenvalue spectrum of W_P"
integral_linear = "rank plus Smith invariant factors"
finite_labelled = "ordered observer-fiber sizes or separation partition"
noncommutative = "blockwise Gramian spectra plus commutant dimensions"

[[sample]]
id = "toric_local_syndrome_on_primal_logical_sector"
sector = "kitaev"
scale = "finite_system"
context = "H_1 primal logical Z quotient on a marked finite torus"
profile = [2, 1, 1, 1]
strength_representation = "hilbert_linear"
spectrum_status = "exact_after_declared_binary_orthonormalization"
spectrum = [0, 0]
visible_rank = 0
kernel_dimension = 2
domain_statement = "local syndrome identifies no primal logical direction"
evidence_ref = "research/kitaev/toric-code-selection-readout-decoding.md"

[[sample]]
